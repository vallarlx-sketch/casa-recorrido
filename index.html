<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recorrido interactivo · DapSam Arquitectos</title>
<meta name="theme-color" content="#0d0c0a">
<meta name="robots" content="noindex">
<meta name="description" content="Recorre la casa por fuera y por dentro: cada espacio en 360 grados, planta por planta.">
<meta property="og:type" content="website">
<meta property="og:title" content="Recorrido interactivo · DapSam Arquitectos">
<meta property="og:description" content="Recorre la casa por fuera y por dentro, en 360 grados.">
<meta property="og:url" content="https://vallarlx-sketch.github.io/casa-recorrido/">
<meta property="og:image" content="https://vallarlx-sketch.github.io/casa-recorrido/media/compartir.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --tinta:#0d0c0a; --papel:#f3eee6; --tenue:rgba(243,238,230,.62); --linea:rgba(243,238,230,.18); --luz:#e6b873;
  --vidrio:rgba(13,12,10,.52);
  --serif:"Cormorant Garamond","Didot","Bodoni 72",Georgia,serif;
  --sans:"Jost","Avenir Next","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--tinta);color:var(--papel);font-family:var(--sans);font-weight:300;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--luz);outline-offset:3px}
svg{display:block}
.marca{font-size:12px;font-weight:500;letter-spacing:.34em;text-transform:uppercase;white-space:nowrap}
.marca span{font-weight:300;color:var(--tenue)}
.eyebrow{font-size:11px;font-weight:400;letter-spacing:.3em;text-transform:uppercase;color:var(--tenue)}
.esmerilado{background:var(--vidrio);border:1px solid var(--linea);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.pastilla{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;font-size:10.5px;font-weight:400;letter-spacing:.18em;text-transform:uppercase;white-space:nowrap;transition:background .3s,color .3s,border-color .3s}
.pastilla:hover{border-color:var(--luz)}
.pastilla.llena{background:var(--papel);border-color:var(--papel);color:#17130d}
.pastilla.oro{background:var(--luz);border-color:var(--luz);color:#1a140b}
.redondo{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;transition:background .3s,color .3s,border-color .3s}
.redondo:hover{background:var(--papel);border-color:var(--papel);color:#17130d}

/* ── Barra superior ── */
.barra{position:fixed;z-index:30;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:calc(env(safe-area-inset-top,0px) + 20px) clamp(18px,3vw,40px) 0;pointer-events:none}
.barra > *{pointer-events:auto}
.pestañas{display:flex;gap:4px;padding:4px;border-radius:999px}
.pestañas button{display:flex;align-items:center;gap:8px;height:36px;line-height:1;padding:0 16px;border-radius:999px;font-size:10.5px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;color:var(--tenue);white-space:nowrap;transition:background .35s,color .35s}
.pestañas button i{font-style:normal;font-size:9px;letter-spacing:.1em;opacity:.7}
.pestañas button:hover{color:var(--papel)}
.pestañas button[aria-current="true"]{background:var(--papel);color:#17130d}

/* ── Fondo desenfocado (exterior) ── */
.fondo{position:fixed;inset:-80px;z-index:0;pointer-events:none}
.fondo i{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(70px) saturate(1.25) brightness(.34);opacity:0;transition:opacity 1.1s ease}
.fondo i.visible{opacity:1}
.fondo::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(13,12,10,0) 30%,rgba(13,12,10,.72) 100%)}

/* ── Modo exterior ── */
.exterior{position:fixed;inset:0;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);opacity:0;visibility:hidden;transition:opacity .6s ease,visibility 0s .6s}
body[data-modo="exterior"] .exterior{opacity:1;visibility:visible;transition:opacity .6s ease}
.panel{display:flex;flex-direction:column;justify-content:center;min-width:0;padding:100px clamp(22px,3.4vw,60px) 44px}
.panel-izq{justify-self:end;width:min(100%,360px)}
.lista{display:flex;flex-direction:column;margin:22px 0 30px}
.lista button{position:relative;display:flex;align-items:baseline;gap:16px;width:100%;text-align:left;padding:9px 0;color:var(--tenue);transition:color .35s,transform .45s cubic-bezier(.2,.7,.2,1)}
.lista .n{font-size:11px;font-weight:400;letter-spacing:.12em;width:20px;flex:none;opacity:.75}
.lista .t{font-family:var(--serif);font-size:clamp(20px,2.9vh,27px);line-height:1.15;white-space:nowrap}
.lista button::before{content:"";position:absolute;left:-34px;top:50%;width:22px;height:1px;background:var(--luz);transform:scaleX(0);transform-origin:left;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.lista button:hover{color:var(--papel)}
.lista button[aria-current="true"]{color:var(--papel);transform:translateX(10px)}
.lista button[aria-current="true"] .n{color:var(--luz);opacity:1}
.lista button[aria-current="true"]::before{transform:scaleX(1)}
.escena{position:relative;align-self:center;height:calc(100vh - 110px);height:calc(100dvh - 110px);margin-top:66px;aspect-ratio:9/16;border-radius:16px;overflow:hidden;background:#000;box-shadow:0 50px 140px rgba(0,0,0,.65),0 0 0 1px rgba(243,238,230,.07);touch-action:pan-y}
.escena video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 650ms ease}
.escena video.visible{opacity:1}
.velo{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(180deg,rgba(8,7,6,.45) 0%,rgba(8,7,6,0) 17%,rgba(8,7,6,0) 52%,rgba(8,7,6,.82) 100%)}
.rotulo{position:absolute;z-index:5;left:28px;right:28px;bottom:34px}
.sub{font-size:11px;font-weight:400;letter-spacing:.28em;text-transform:uppercase;color:var(--luz)}
.titulo{font-family:var(--serif);font-weight:400;font-size:clamp(34px,5.2vh,50px);line-height:1.02;margin-top:8px;text-wrap:balance}
.cambia{animation:sube .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes sube{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fila{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.momento{display:inline-flex;padding:3px;border-radius:999px}
.momento button{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 14px;border-radius:999px;font-size:10.5px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;color:var(--tenue);transition:background .35s,color .35s}
.momento button[aria-pressed="true"]{background:var(--papel);color:#17130d}
.progreso{position:absolute;z-index:5;left:0;right:0;bottom:0;height:2px;background:rgba(243,238,230,.14)}
.progreso i{display:block;height:100%;background:var(--luz);transform-origin:left;transform:scaleX(0)}
.panel-der{justify-self:start;width:min(100%,420px)}
.invita h2{font-family:var(--serif);font-weight:400;font-size:clamp(28px,3.6vh,38px);line-height:1.08;margin-top:14px;text-wrap:balance}
.invita p.texto{margin-top:14px;font-size:14px;line-height:1.6;color:var(--tenue);max-width:34ch}
.plantas{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:26px}
.plantas button{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:4/5;text-align:left;background-size:cover;background-position:center;box-shadow:inset 0 0 0 1px var(--linea);transition:transform .5s cubic-bezier(.2,.7,.2,1),box-shadow .3s}
.plantas button::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,7,6,.05) 30%,rgba(8,7,6,.86) 100%)}
.plantas button:hover{transform:translateY(-4px);box-shadow:inset 0 0 0 1px var(--luz)}
.plantas span{position:absolute;left:14px;right:14px;bottom:13px}
.plantas b{display:block;font-family:var(--serif);font-weight:400;font-size:22px;line-height:1.1}
.plantas small{display:block;margin-top:5px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--tenue)}
.tira{display:none}

/* ── Modo 360 ── */
.tour{position:fixed;inset:0;z-index:1;opacity:0;visibility:hidden;transition:opacity .6s ease,visibility 0s .6s}
body[data-modo="tour"] .tour{opacity:1;visibility:visible;transition:opacity .6s ease}
#lienzo{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none;transition:opacity .45s ease}
#lienzo.arrastrando{cursor:grabbing}
#lienzo.cargando{opacity:0}
.tour .sombra{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(8,7,6,.5) 0%,rgba(8,7,6,0) 16%,rgba(8,7,6,0) 62%,rgba(8,7,6,.72) 100%)}
.puntos{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ir{position:absolute;left:0;top:0;display:inline-flex;align-items:center;gap:9px;height:38px;padding:0 15px 0 11px;border-radius:999px;font-size:10.5px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;pointer-events:auto;will-change:transform;transition:background .3s,color .3s,border-color .3s,opacity .3s}
.ir::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--luz);box-shadow:0 0 0 5px rgba(230,184,115,.22)}
.ir:hover{background:var(--papel);border-color:var(--papel);color:#17130d}
.ir.oculto{opacity:0;pointer-events:none}
.tarjeta{position:absolute;z-index:6;left:clamp(18px,3vw,40px);top:96px;width:300px;border-radius:18px;padding:18px 18px 14px;background:rgba(13,12,10,.74);max-height:calc(100vh - 120px);max-height:calc(100dvh - 120px);overflow-y:auto;scrollbar-width:none}
.tarjeta::-webkit-scrollbar{display:none}
.tarjeta .cab{display:flex;align-items:center;justify-content:space-between}
.plano{position:relative;width:100%;max-width:calc((100vh - 420px) * .667);max-width:calc((100dvh - 420px) * .667);margin:12px auto 0}
.plano img{display:block;width:100%;opacity:.9;user-select:none;-webkit-user-drag:none}
.plano svg{position:absolute;inset:0;width:100%;height:100%}
.zona{fill:rgba(230,184,115,0);stroke:rgba(230,184,115,0);stroke-width:2;cursor:pointer;transition:fill .3s,stroke .3s}
.zona:hover{fill:rgba(230,184,115,.2);stroke:rgba(230,184,115,.7)}
.zona[aria-current="true"]{fill:rgba(230,184,115,.3);stroke:var(--luz)}
body.ver-zonas .zona{fill:rgba(230,184,115,.22);stroke:rgba(230,184,115,.8)}
body.ver-zonas .tarjeta{width:560px}
.camara{fill:var(--papel);stroke:rgba(13,12,10,.6);stroke-width:3;pointer-events:none;transition:fill .3s}
.camara[aria-current="true"]{fill:var(--luz)}
.mira{fill:rgba(230,184,115,.4);pointer-events:none}
.cuartos{display:flex;flex-direction:column;margin-top:10px;border-top:1px solid var(--linea);padding-top:8px}
.cuartos button{display:flex;align-items:baseline;gap:12px;padding:6px 2px;text-align:left;color:var(--tenue);transition:color .3s}
.cuartos button .n{font-size:10px;letter-spacing:.1em;width:16px;opacity:.7}
.cuartos button .t{font-family:var(--serif);font-size:18px;line-height:1.15}
.cuartos button:hover{color:var(--papel)}
.cuartos button[aria-current="true"]{color:var(--papel)}
.cuartos button[aria-current="true"] .n{color:var(--luz);opacity:1}
.pie{position:absolute;z-index:6;left:calc(clamp(18px,3vw,40px) + 332px);right:clamp(18px,3vw,40px);bottom:calc(env(safe-area-inset-bottom,0px) + 30px);display:flex;align-items:flex-end;justify-content:space-between;gap:20px;pointer-events:none}
.pie > *{pointer-events:auto}
.pie .titulo{font-size:clamp(34px,5.6vh,56px);text-shadow:0 2px 30px rgba(0,0,0,.45)}
.pie .sub{text-shadow:0 1px 14px rgba(0,0,0,.6)}
.acciones{display:flex;gap:8px;align-items:center}
.pista{position:absolute;z-index:6;left:50%;top:calc(env(safe-area-inset-top,0px) + 86px);transform:translateX(-50%);height:38px;padding:0 16px;border-radius:999px;display:flex;align-items:center;gap:9px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;white-space:nowrap;pointer-events:none;transition:opacity .6s}
.pista.fuera{opacity:0}
.chips{display:none}
.abrir-plano{display:none}

/* ── Maqueta en corte: entrada a cada planta ── */
.maqueta{position:absolute;inset:0;z-index:4;display:grid;place-items:center;background:#0d0c0a;opacity:0;visibility:hidden;transition:opacity .6s ease,visibility 0s .6s}
body[data-tour="maqueta"] .maqueta{opacity:1;visibility:visible;transition:opacity .6s ease}
.maqueta .caja{position:relative;height:min(84vh,84dvh,112vw);aspect-ratio:1692/2064;margin-top:30px;transition:transform .6s cubic-bezier(.5,0,.2,1),opacity .5s ease}
.maqueta .caja.acercando{transform:scale(2.6);opacity:0}
.maqueta img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none}
.maqueta .ir{transform:translate(-50%,-50%);animation:sube .7s cubic-bezier(.2,.7,.2,1) both}
.maqueta::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(13,12,10,0) 55%,rgba(13,12,10,.55) 100%)}
body[data-tour="maqueta"] .tarjeta,body[data-tour="maqueta"] .pista,body[data-tour="maqueta"] .puntos,body[data-tour="maqueta"] .chips,body[data-tour="maqueta"] .acciones{display:none}
body[data-tour="maqueta"] .pie{z-index:7;left:clamp(18px,3vw,40px)}

/* ── Video dentro del recorrido ── */
.cine{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(8,7,6,.86);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s .4s}
body.cine-abierto .cine{opacity:1;visibility:visible;transition:opacity .4s ease}
.cine .marco{position:relative;height:min(86vh,86dvh);aspect-ratio:9/16;max-width:92vw;border-radius:16px;overflow:hidden;background:#000;box-shadow:0 40px 120px rgba(0,0,0,.7)}
.cine video{width:100%;height:100%;object-fit:cover;display:block}
.cine .cerrar{position:absolute;top:14px;right:14px;z-index:2}
.cine .otros{position:absolute;left:14px;right:14px;bottom:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.cine .otros button[aria-pressed="true"]{background:var(--papel);border-color:var(--papel);color:#17130d}

/* ── Ventanas medianas ── */
@media (max-width:1179px),(max-aspect-ratio:3/2){
  .exterior{grid-template-columns:minmax(0,360px) auto;justify-content:center}
  .panel-izq{justify-self:stretch;width:auto}
  .panel-der{display:none}
  .solo-compacto{display:inline-flex!important}
}
.solo-compacto{display:none!important}

/* ── Teléfono ── */
@media (max-width:900px),(max-aspect-ratio:1/1){
  .barra{padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 0;flex-direction:column;align-items:stretch;gap:10px}
  .barra .marca{font-size:10.5px;letter-spacing:.28em;text-align:center}
  .pestañas{justify-content:space-between}
  .pestañas button{flex:1;justify-content:center;padding:0 6px;font-size:10px;letter-spacing:.14em}
  .pestañas button i{display:none}
  .exterior{display:block}
  .panel-izq{display:none}
  .escena{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:auto;height:100%;max-width:100%;margin:0;border-radius:0;box-shadow:0 0 120px rgba(0,0,0,.6)}
  .velo{background:linear-gradient(180deg,rgba(8,7,6,.7) 0%,rgba(8,7,6,0) 22%,rgba(8,7,6,0) 44%,rgba(8,7,6,.9) 100%)}
  .rotulo{left:20px;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 140px)}
  .titulo{font-size:clamp(32px,9.5vw,44px)}
  .fila{margin-top:14px}
  .progreso{bottom:calc(env(safe-area-inset-bottom,0px) + 122px);left:20px;right:20px;height:1px}
  .tira{position:absolute;z-index:5;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:8px;padding:0 20px;overflow-x:auto;scrollbar-width:none}
  .tira::-webkit-scrollbar{display:none}
  .tira button{position:relative;flex:none;width:72px;height:96px;border-radius:9px;overflow:hidden;background-size:cover;background-position:center;box-shadow:inset 0 0 0 1px rgba(243,238,230,.18);opacity:.72}
  .tira button::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,7,6,0) 45%,rgba(8,7,6,.85) 100%)}
  .tira button span{position:absolute;left:0;right:0;bottom:7px;text-align:center;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
  .tira button[aria-current="true"]{opacity:1;box-shadow:inset 0 0 0 1.5px var(--luz)}
  .tarjeta{left:0;right:0;top:0;bottom:0;width:auto;border-radius:0;border:0;z-index:40;padding:calc(env(safe-area-inset-top,0px) + 22px) 22px 22px;display:flex;flex-direction:column;justify-content:center;background:rgba(13,12,10,.93);opacity:0;visibility:hidden;transform:translateY(16px);transition:opacity .4s,transform .4s,visibility 0s .4s}
  body.plano-abierto .tarjeta{opacity:1;visibility:visible;transform:none;transition:opacity .4s,transform .4s}
  .tarjeta{max-height:none}
  .tarjeta .plano{max-width:min(100%,calc((100dvh - 330px) * .667));align-self:center}
  .tarjeta .cerrar-plano{display:grid!important}
  .pie{left:20px;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 72px);flex-direction:column;align-items:flex-start;gap:14px}
  .pie .titulo{font-size:clamp(32px,9.5vw,44px)}
  .acciones .flecha{display:none}
  .abrir-plano{display:inline-flex}
  .pista{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 112px)}
  .chips{position:absolute;z-index:6;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;gap:8px;padding:0 20px;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chips button{flex:none;height:40px;padding:0 16px;border-radius:999px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;color:var(--tenue)}
  .chips button[aria-current="true"]{background:var(--papel);border-color:var(--papel);color:#17130d}
  .ir{height:34px;font-size:10px;padding:0 12px 0 9px}
  .maqueta .caja{margin-top:60px;height:min(66dvh,117vw)}
  .maqueta .ir{height:30px;font-size:9.5px;letter-spacing:.1em;padding:0 10px 0 8px}
  body[data-tour="maqueta"] .pie{bottom:calc(env(safe-area-inset-bottom,0px) + 26px)}
}
.cerrar-plano{display:none}
@media (prefers-reduced-motion:reduce){.cambia{animation:none}}
</style>
</head>
<body data-modo="exterior">

<div class="fondo" aria-hidden="true"><i></i><i></i></div>

<header class="barra">
  <p class="marca">DapSam <span>Arquitectos</span></p>
  <nav class="pestañas esmerilado" id="pestañas" aria-label="Secciones">
    <button type="button" data-ir="exterior"><i>01</i>Exterior</button>
    <button type="button" data-ir="baja"><i>02</i>Planta baja</button>
    <button type="button" data-ir="alta"><i>03</i>Planta alta</button>
  </nav>
</header>

<!-- ─────────── Exterior: videos ─────────── -->
<main class="exterior" id="exterior">
  <aside class="panel panel-izq">
    <p class="eyebrow">Exterior</p>
    <nav class="lista" id="lista" aria-label="Vistas del exterior"></nav>
    <button class="pastilla oro solo-compacto" type="button" data-ir="baja" style="align-self:flex-start">Recorrer por dentro
      <svg width="13" height="11" viewBox="0 0 14 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 6h12M8.5 1.5L13 6l-4.5 4.5"/></svg>
    </button>
  </aside>

  <section class="escena" id="escena" aria-label="Video del exterior">
    <video id="va" muted playsinline preload="auto"></video>
    <video id="vb" muted playsinline preload="auto"></video>
    <div class="velo"></div>
    <div class="rotulo">
      <p class="sub" id="extSub"></p>
      <h1 class="titulo" id="extTitulo"></h1>
      <div class="fila">

  }

  giro += dg; alza += da; px = e.clientX; py = e.clientY;
  velGiro = Math.max(-.03, Math.min(.03, dg)); velAlza = Math.max(-.03, Math.min(.03, da));
});
const soltar = e => { dedos.delete(e.pointerId); separacion = 0; if (!dedos.size) { arrastra = false; lienzo.classList.remove('arrastrando'); } else { const r = [...dedos.values()][0]; px = r[0]; py = r[1]; } };
lienzo.addEventListener('pointerup', soltar); lienzo.addEventListener('pointercancel', soltar);
lienzo.addEventListener('wheel', e => { e.preventDefault(); campo = Math.max(rad(40), Math.min(rad(100), campo + e.deltaY * .0012)); }, { passive:false });

/* Flechas hacia otros espacios, proyectadas sobre la vista */
let enlaces = [];
function armarEnlaces(v) {
  $('#puntos').innerHTML = ''; enlaces = [];
  (ENLACES[v.id] || []).forEach(id => {
    const d = vista(id); if (!d) return;
    const otraPlanta = d.planta !== v.planta;
    const lon = Math.atan2(d.cam[0] - v.cam[0], d.cam[1] - v.cam[1]);
    const lat = rad(otraPlanta ? (d.planta === 'alta' ? 24 : -30) : -10);
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'ir esmerilado oculto';      // nace oculta hasta que se calcula su lugar
    b.textContent = otraPlanta ? (d.planta === 'alta' ? 'Subir a planta alta' : 'Bajar al hall') : d.titulo;
    b.onclick = () => irVista(id);
    $('#puntos').appendChild(b);
    enlaces.push({ b, x:Math.sin(lon) * Math.cos(lat), y:Math.sin(lat), z:-Math.cos(lon) * Math.cos(lat) });
  });
}
function colocarEnlaces() {
  const W = lienzo.clientWidth, H = lienzo.clientHeight, tf = Math.tan(campo / 2), cg = Math.cos(giro), sg = Math.sin(giro), ca = Math.cos(alza), sa = Math.sin(alza);
  for (const e of enlaces) {
    const x1 = e.x * cg + e.z * sg, z1 = -e.x * sg + e.z * cg, y1 = e.y;
    const y0 = y1 * ca + z1 * sa, z0 = -y1 * sa + z1 * ca;
    if (z0 > -0.15) { e.b.classList.add('oculto'); continue; }
    const nx = (x1 / -z0) / (tf * W / H), ny = (y0 / -z0) / tf;
    const fuera = Math.abs(nx) > 1.05 || Math.abs(ny) > 1.05;
    e.b.classList.toggle('oculto', fuera);
    if (!fuera) e.b.style.transform = `translate(${((nx + 1) / 2 * W).toFixed(1)}px,${((1 - ny) / 2 * H).toFixed(1)}px) translate(-50%,-50%)`;
  }
}

/* ═════════ Plano con zonas ═════════ */
const NS = 'http://www.w3.org/2000/svg';
let conoMira = null;
function aPlano(p, x, y) { return [p.ox + (x - p.x0) * p.e, p.oy - (y - p.y0) * p.e]; }
function armarPlanta(nombre) {
  planta = nombre;
  const p = PLANTAS[nombre], svg = $('#planoSvg');
  $('#nombrePlanta').textContent = p.nombre;
  $('#planoImg').src = p.plano; $('#planoImg').alt = 'Plano de la ' + p.nombre.toLowerCase();
  svg.setAttribute('viewBox', `0 0 ${p.ancho} ${p.alto}`); svg.innerHTML = '';
  $('#cuartos').innerHTML = ''; $('#chips').innerHTML = '';
  conoMira = document.createElementNS(NS, 'path'); conoMira.setAttribute('class', 'mira'); svg.appendChild(conoMira);
  deLaPlanta(nombre).forEach((v, i) => {
    const [ax, ay] = aPlano(p, v.zona[0], v.zona[3]), [bx, by] = aPlano(p, v.zona[1], v.zona[2]);
    const r = document.createElementNS(NS, 'rect');
    r.setAttribute('x', ax); r.setAttribute('y', ay); r.setAttribute('width', bx - ax); r.setAttribute('height', by - ay); r.setAttribute('rx', 6);
    r.setAttribute('class', 'zona'); r.dataset.id = v.id;
    const t = document.createElementNS(NS, 'title'); t.textContent = v.titulo; r.appendChild(t);
    r.addEventListener('click', () => { irVista(v.id); document.body.classList.remove('plano-abierto'); });
    svg.appendChild(r);
    const [cx, cy] = aPlano(p, v.cam[0], v.cam[1]);
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('r', 9); c.setAttribute('class', 'camara'); c.dataset.id = v.id;
    svg.appendChild(c);
    const b = document.createElement('button');
    b.type = 'button'; b.dataset.id = v.id;
    b.innerHTML = `<span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${v.titulo}</span>`;
    b.onclick = () => { irVista(v.id); document.body.classList.remove('plano-abierto'); };
    $('#cuartos').appendChild(b);
    const ch = document.createElement('button');
    ch.type = 'button'; ch.className = 'esmerilado'; ch.dataset.id = v.id; ch.textContent = v.titulo;
    ch.onclick = () => irVista(v.id);
    $('#chips').appendChild(ch);
  });
}
function dibujarMira() {       // abanico en el plano que muestra hacia dónde se está mirando
  if (!conoMira || !actual360) return;
  const p = PLANTAS[actual360.planta], [cx, cy] = aPlano(p, actual360.cam[0], actual360.cam[1]);
  const medio = campo * (lienzo.clientWidth / Math.max(1, lienzo.clientHeight)) / 2, a0 = giro - Math.min(medio, 1.1), a1 = giro + Math.min(medio, 1.1), R = 62;
  conoMira.setAttribute('d', `M${cx} ${cy} L${cx + Math.sin(a0) * R} ${cy - Math.cos(a0) * R} A${R} ${R} 0 0 1 ${cx + Math.sin(a1) * R} ${cy - Math.cos(a1) * R} Z`);
}
function marcar(id) {
  document.querySelectorAll('#planoSvg [data-id], #cuartos [data-id], #chips [data-id]').forEach(e => e.setAttribute('aria-current', e.dataset.id === id));
  const ch = document.querySelector(`#chips [data-id="${id}"]`);
  if (ch) ch.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
}
function irVista(id, sinHash) {
  const v = vista(id); if (!v) return;
  document.body.dataset.tour = 'vista';
  if (v.planta !== planta || !$('#planoSvg').children.length) armarPlanta(v.planta);
  const primera = actual360 === null;
  actual360 = v; marcar(id);
  $('#tourSub').textContent = v.sub; $('#tourTitulo').textContent = v.titulo;
  [$('#tourSub'), $('#tourTitulo')].forEach(e => { e.classList.remove('cambia'); void e.offsetWidth; e.classList.add('cambia'); });
  $('#verVideo').hidden = !v.videos;
  $('#puntos').innerHTML = ''; enlaces = [];
  cargar360(id, () => { giro = rad(v.mira); alza = rad(v.alza || 0); velGiro = velAlza = 0; campo = rad(82); tocado = !primera && tocado; armarEnlaces(v); });
  document.querySelectorAll('#pestañas button').forEach(b => b.setAttribute('aria-current', b.dataset.ir === v.planta));
  if (!sinHash) ponerHash(id);
  const lista = deLaPlanta(v.planta), sig = lista[(lista.indexOf(v) + 1) % lista.length];
  new Image().src = `media/360/${sig.id}.jpg?v=${VERSION}`;      // deja lista la siguiente
}
function verMaqueta(nombre) {          // entrada a una planta: la maqueta con un punto por espacio
  const p = PLANTAS[nombre], caja = $('#maquetaCaja');
  if (planta !== nombre || !$('#planoSvg').children.length) armarPlanta(nombre);
  document.body.dataset.tour = 'maqueta';
  document.body.classList.remove('plano-abierto');
  caja.classList.remove('acercando');
  $('#maquetaImg').src = `media/maqueta-${nombre}.jpg?v=${VERSION}`;
  $('#maquetaImg').alt = 'Maqueta de la ' + p.nombre.toLowerCase();
  caja.querySelectorAll('.ir').forEach(b => b.remove());
  deLaPlanta(nombre).forEach((v, k) => {
    const [x, y] = MAQUETA[nombre][v.id];
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'ir esmerilado'; b.textContent = v.titulo;
    b.style.left = x + '%'; b.style.top = y + '%'; b.style.animationDelay = (0.25 + k * 0.06) + 's';
    b.addEventListener('pointerenter', () => { new Image().src = `media/360/${v.id}.jpg?v=${VERSION}`; });
    b.onclick = () => {
      caja.style.transformOrigin = `${x}% ${y}%`; caja.classList.add('acercando');
      setTimeout(() => irVista(v.id), 480);
    };
    caja.appendChild(b);
  });
  $('#tourSub').textContent = 'Elige un espacio'; $('#tourTitulo').textContent = p.nombre;
  [$('#tourSub'), $('#tourTitulo')].forEach(e => { e.classList.remove('cambia'); void e.offsetWidth; e.classList.add('cambia'); });
  document.querySelectorAll('#pestañas button').forEach(b => b.setAttribute('aria-current', b.dataset.ir === nombre));
  ponerHash(nombre);
}
function pasoVista(d) {
  if (document.body.dataset.tour === 'maqueta') return;
  const lista = deLaPlanta(planta), i = lista.indexOf(actual360);
  irVista(lista[(i + d + lista.length) % lista.length].id);
}
$('#anterior').onclick = () => pasoVista(-1);
$('#siguiente').onclick = () => pasoVista(1);
$('#volverMaqueta').onclick = () => verMaqueta(planta);
$('#abrirPlano').onclick = () => document.body.classList.add('plano-abierto');
$('#cerrarPlano').onclick = () => document.body.classList.remove('plano-abierto');

/* ═════════ Video de un espacio ═════════ */
function abrirCine() {
  const v = actual360; if (!v || !v.videos) return;
  const otros = $('#cineOtros'); otros.innerHTML = '';
  const poner = k => {
    $('#cineVideo').src = `media/${v.videos[k][0]}.mp4`; $('#cineVideo').play().catch(() => {});
    [...otros.children].forEach((b, j) => b.setAttribute('aria-pressed', j === k));
  };
  if (v.videos.length > 1) v.videos.forEach((par, k) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'pastilla esmerilado'; b.textContent = par[1]; b.onclick = () => poner(k);
    otros.appendChild(b);
  });
  poner(0);
  document.body.classList.add('cine-abierto');
}
function cerrarCine() { document.body.classList.remove('cine-abierto'); $('#cineVideo').pause(); }
$('#verVideo').onclick = abrirCine;
$('#cerrarCine').onclick = cerrarCine;
$('#cine').addEventListener('click', e => { if (e.target === e.currentTarget) cerrarCine(); });

/* ═════════ Cambiar de sección ═════════ */
function ponerHash(h) { try { history.replaceState(null, '', '#' + h); } catch (e) {} }
function ponerModo(m) {
  modo = m; document.body.dataset.modo = m;
  if (m === 'exterior') {
    document.querySelectorAll('#pestañas button').forEach(b => b.setAttribute('aria-current', b.dataset.ir === 'exterior'));
    const v = capas[frente]; if (v.currentSrc && !v.ended) v.play().catch(() => {});
    if (ext >= 0) ponerHash(EXTERIOR[ext].id);
  } else capas.forEach(v => v.pause());
  document.body.classList.remove('plano-abierto');
}
function ir(destino) {                 // 'exterior', 'baja', 'alta' o el id de una vista
  if (destino === 'exterior') { ponerModo('exterior'); return; }
  const e = EXTERIOR.findIndex(v => v.id === destino);
  if (e >= 0) { ponerModo('exterior'); irExterior(e); return; }
  ponerModo('tour');
  if (PLANTAS[destino]) verMaqueta(destino); else irVista(destino);
}
document.querySelectorAll('[data-ir]').forEach(b => b.addEventListener('click', () => ir(b.dataset.ir)));
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Escape') { cerrarCine(); document.body.classList.remove('plano-abierto'); }
  else if (e.key === 'ArrowRight') modo === 'tour' ? pasoVista(1) : irExterior(ext + 1);
  else if (e.key === 'ArrowLeft') modo === 'tour' ? pasoVista(-1) : irExterior(ext - 1);
});
let x0 = null, y0 = 0;
$('#escena').addEventListener('touchstart', e => { if (e.target.closest('.tira, button')) { x0 = null; return; } x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive:true });
$('#escena').addEventListener('touchend', e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
  if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.4) irExterior(ext + (dx < 0 ? 1 : -1));
}, { passive:true });
document.addEventListener('pointerdown', () => { const v = capas[frente]; if (modo === 'exterior' && v.currentSrc && v.paused && !v.ended) v.play().catch(() => {}); });
document.addEventListener('visibilitychange', () => { const v = capas[frente]; if (!document.hidden && modo === 'exterior' && v.currentSrc && !v.ended) v.play().catch(() => {}); });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1), aqui = modo !== 'tour' ? EXTERIOR[ext].id : (document.body.dataset.tour === 'maqueta' ? planta : actual360 && actual360.id); if (h && h !== aqui) ir(h); });

/* ═════════ Arranque ═════════ */
if (new URLSearchParams(location.search).has('zonas')) document.body.classList.add('ver-zonas');   // ayuda para ajustar las zonas del plano
$('#cuentaBaja').textContent = deLaPlanta('baja').length + ' espacios';
$('#cuentaAlta').textContent = deLaPlanta('alta').length + ' espacios';
const inicial = location.hash.slice(1);      // se lee antes de arrancar: el exterior escribe su propio enlace
irExterior(0);
if (inicial && (vista(inicial) || PLANTAS[inicial] || EXTERIOR.some(v => v.id === inicial))) ir(inicial); else ponerModo('exterior');
window.estado = () => ({ modo, tour: document.body.dataset.tour, planta, vista: actual360 && actual360.id, exterior: EXTERIOR[ext].id, giro: +(giro * 180 / Math.PI).toFixed(1), textura: !!textura, enlaces: enlaces.length });
</script>
